<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流管理系统</title>
    <!-- 提前建立与 Turnstile 域名的连接，缩短脚本请求的 DNS/TLS 握手耗时 -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com">
    <script>
      // 必须在 api.js 之前用同步内联脚本定义：api.js 是 async 加载，
      // 加载完成的那一刻会立即到 window 上找这个回调并调用，
      // 如果放到 Vue 组件的 onMounted 里再挂载，往往会晚于脚本执行，导致 Turnstile 报
      // "Unable to find onload callback" 且不会再重试。这里只做全局就绪标记 + 广播事件，
      // 具体渲染逻辑仍由各页面组件自己决定（见 src/views/login 等页面的 waitForTurnstile）。
      window.onTurnstileScriptLoad = function () {
        window.__turnstileReady = true
        document.dispatchEvent(new Event('turnstile-ready'))
      }
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileScriptLoad&render=explicit" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
